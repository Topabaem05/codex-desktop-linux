name: macOS port probe
on:
  push:
    branches: [feat/cross-platform-memory-budget]
    paths: ['.github/workflows/macos-port-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Inspect original entitlement contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/probe-mount"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg -o "$RUNNER_TEMP/upstream.dmg"
          shasum -a 256 "$RUNNER_TEMP/upstream.dmg" | tee reports/upstream-sha.txt
          hdiutil attach "$RUNNER_TEMP/upstream.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/probe-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/probe-mount" || true' EXIT
          app=$(find "$RUNNER_TEMP/probe-mount" -maxdepth 1 -name '*.app' -type d -print -quit)
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" 2>&1 | tee reports/entitlements.txt
          python3 - "$app" <<'PY' | tee reports/nested-entitlements.txt
          import pathlib,subprocess,sys
          app=pathlib.Path(sys.argv[1])
          for p in app.rglob('*.app'):
              if p.is_symlink():continue
              print('\nBUNDLE',p.relative_to(app))
              r=subprocess.run(['codesign','-d','--entitlements',':-',str(p)],capture_output=True,text=True)
              print(r.stdout)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-port-entitlements
          path: reports/
          retention-days: 7
